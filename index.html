<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Detection</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Object Detection using YOLO</h1>
        <p class="intro-text">Detect objects in images, videos, and live feeds effortlessly!</p>
    </header>

    <div class="container">
        <!-- Form for Image Upload -->
        <div class="form-container">
            <form action="/detect_image" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
                <div class="upload-section">
                    <h2>Upload Image</h2>
                    <select name="model" required>
                        <option value="yolov8s">YOLOv8 Small</option>
                        <option value="yolov8m">YOLOv8 Medium</option>
                        <option value="yolov8l">YOLOv8 Large</option>
                    </select>
                    <input type="file" name="file" accept="image/*" required title="Upload an image file (JPEG/PNG)">
                    <button type="submit">Detect Objects</button>
                </div>
            </form>
        </div>

        <!-- Form for Video Upload -->
        <div class="form-container">
            <form action="/detect_video" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
                <div class="upload-section">
                    <h2>Upload Video</h2>
                    <select name="model" required>
                        <option value="yolov8s">YOLOv8 Small</option>
                        <option value="yolov8m">YOLOv8 Medium</option>
                        <option value="yolov8l">YOLOv8 Large</option>
                    </select>
                    <input type="file" name="file" accept="video/*" required title="Upload a video file (MP4/AVI)">
                    <button type="submit">Detect Objects</button>
                </div>
            </form>
        </div>

        <!-- Link for Live Webcam Detection -->
        <div class="form-container live">
            <form action="/live_detection" method="get">
                <div class="upload-section">
                    <h2>Live Webcam Detection</h2>
                    <select name="model" required>
                        <option value="yolov8s">YOLOv8 Small</option>
                        <option value="yolov8m">YOLOv8 Medium</option>
                        <option value="yolov8l">YOLOv8 Large</option>
                    </select>
                    <button class="live-button" type="submit">Start Live Detection</button>
                </div>
            </form>
        </div>
    </div>

    <div id="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <div id="result" class="result-section" style="display: none;">
        <h2>Detection Result</h2>
        <img id="output-image" src="#" alt="Processed Image">
    </div>

    <footer>
        <p>© 2024 Object Detection, By Harsh and Aayush.</p>
    </footer>

    <script>
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }

        function displayResult(imageSrc) {
            document.getElementById('loading').style.display = 'none';
            const resultSection = document.getElementById('result');
            const outputImage = document.getElementById('output-image');
            outputImage.src = imageSrc;
            outputImage.style.display = 'block';
            resultSection.style.display = 'block';
        }
    </script>
</body>
</html>
